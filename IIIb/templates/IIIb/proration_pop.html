         onclick="closedel();">


        </td>

<script>
    function closedel() { 
        $("#cancel").dialog("close");
    }
</script>






   <script language="javascript" type="text/javascript">
        function disable(f)
        {
            var button = f.elements['submit'];
            button.value = 'Processing';
            button.disabled = 'true';
            return true;
        }
    </script>
