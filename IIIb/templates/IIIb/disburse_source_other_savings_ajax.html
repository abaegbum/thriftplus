


<table style="margin-top:0%;margin-bottom:02%;font-size:0.8em" width="100%" class="table table-bordered" id="dataTables-example">
                <tr >
             <td style="font-weight:bold">Saving Schemes</td>
                <td> 
                          <select name="savings" id="id_savings" required >
                            <option value="-">-----</option>
                              {% for pincode in savings %}
                                  <option value="{{pincode.description}}">{{pincode.description}}</option>
                              {% endfor %}
                         </select>
                </td>
            </tr>

          <tr>
                <td style='font-weight:bold'>Application Status</td>
                <td>
                    <select  id="id_status">
                     <option value="-">-----</option>             
                     <option value="Awaiting Disbursal">Awaiting Disbursal</option>
                     <option value="Disbursed">Disbursed</option>
                     
                     </select>
                 </td>
        </tr>

</table>



   <script type="text/javascript" >
        $(document).ready(function() {
            $("#id_savings").change(function () {
                saveee();
            });


            $("#id_status").change(function () {
                saveee();
            });

            $("#id_savings").focus();
            saveee();
        });
    </script>




      <script type="text/javascript" language="javascript">
        function saveee(){
            var state = $("#id_businessyear").val()+ ":" + $("#id_savings").val()+ ":" + $("#id_status").val();
            // alert(state)
            var url = "/IIIb/threeb/setsave/ajax/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    $(".boxscenaros2").show();
                    $(".boxscenaros2").html(html);
                }
            });
            return false;
        }
    </script>
