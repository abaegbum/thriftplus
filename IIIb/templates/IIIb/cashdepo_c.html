<script type="text/javascript" language="javascript">
function getdestination() {
    var state = $("#id_businessyear").val(); // check spelling carefully
    // alert(state);
    var url = "/IIIb/threeb/savings/deposit/monthajax/";

    $("#id_destination").empty();

    if (state) {
        $.ajax({
            type: "POST",
            url: url,
            data: { userid: state },
            success: function(data) {
                var options = '';
                for (var i = 0; i < data.length; i++) {
                    options += '<option value="' + data[i] + '">' + data[i] + '</option>';
                }
                $("#id_destination").append(options);
                autopost20p1();
            },
            error: function(xhr, status, error) {
                console.error("AJAX failed:", status, error);
            }
        });
    }
}

</script>


  <script type="text/javascript" language="javascript">
        function autopost20p1(){
            var state = '{{user}}' + ":" + $("#id_month").val();
            // alert(state)
            var url = "/IIIb/threeb/savings/depoajax/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    $(".boxscenaros").show();
                    $(".boxscenaros").html(html);
                }
            });
            return false;
        }
    </script>
