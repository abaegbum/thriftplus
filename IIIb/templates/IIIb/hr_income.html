</table>
 




    <div id="cancel"></div>
<div id="pay"></div>

   <script type="text/javascript" >
        $(document).ready(function() {            
            $("#id_month").change(function () {
                autopost20p1();
            });

            $("#id_month").focus();
            autopost20p1();
        });
    </script>


  <script type="text/javascript" language="javascript">
        function autopost20p1(){
            var state = $("#id_businessyear").val() + ':'+ $("#id_month").val();
            // alert(state)
            var url = "/IIIb/threeb/staff/myh-r/ajax/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    $(".boxscenaros").show();
                    $(".boxscenaros").html(html);
                }
            });
            return false;
        }
    </script>
