             <td style="font-weight:bold">Year</td>

<table width="100%" class="table  table-bordered" id="dataTables-example">

           <tr>
                <div class="boxapp"></div>
           </tr>
</table>
 


</form>




<div id="cancel"></div>
<div id="pay"></div>

   <script type="text/javascript" >
        $(document).ready(function() {
            $("#id_month").change(function () {
                autopostL();
            });

            $("#id_status").change(function () {
                autopostL();
            });


            $("#id_option").change(function () {
                autopostL();
            });

            $("#id_status").focus();
            autopostL();
        });
    </script>


  <script type="text/javascript" language="javascript">
        function autopostL(){
            var state = $("#id_businessyear").val()+ ":" + $("#id_status").val()+ ":" + $("#id_option").val();
            // alert(state)
            var url = "/IIIb/threeb/loans/approval/ajax/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    $(".boxapp").show();
                    $(".boxapp").html(html);
                }
            });
            return false;
        }
    </script>



<script type="text/javascript" language="javascript">
    function decline(vid){
        var state=vid ;
        // alert(state);
        var url = "/IIIb/threeb/loanspp/decline/pop/";
        var i = 0;
        var data='userid='+state;
        $.ajax({
            type:"POST",
            url:url,
            data:data,
            success:function(html) {
                $("#pay").html(html);
                getdial();
            }
        });
        return false;
    }

</script>


<script type="text/javascript" language="javascript">
    function details(vid){
        var state=vid ;
        // alert(state);
        var url = "/IIIb/threeb/requestdetails/";
        var i = 0;
        var data='userid='+state;
        $.ajax({
            type:"POST",
            url:url,
            data:data,
            success:function(html) {
                $("#pay").html(html);
                getdial();
            }
        });
        return false;
    }

</script>


<script type="text/javascript" language="javascript">
    function getdial(){
        var diaOpts = {
            autoOpen:true,
            // appendTo:"body1",
            // modal:true,
            // position: ["center", "middle"],
            height:'auto',
            width:'auto',
            title:'  Touch this box to close' ,
            closeOnEscape:true,
            show: true,
            hide: true,
            bgiframe: true
        };
        $("#pay").dialog(diaOpts);
    }

</script>





<script type="text/javascript">
function approve(){        
    // Collect checked items
    var selected = [];
    $("input[name='selected_items']:checked").each(function(){
        selected.push($(this).val());
    });

    // Build state info
    var state = $("#id_businessyear").val() + ":" + $("#id_status").val();

    // Prepare data
    var data = {
        userid: state,
        items: selected.join(",")   // send as comma-separated string
    };

    // Ajax call
    $.ajax({
        type: "POST",
        url: "/IIIb/threeb/approvals/pop/",
        data: data,
        success: function(html) {
            $("#cancel").html(html);
            getcancel();
        }
    });
    return false;
}
</script>





<script type="text/javascript" language="javascript">
    function getcancel(){
        var diaOpts = {
            autoOpen:true,
            height:'auto',
            width:'auto',
            title:' Touch this box to close' ,
            closeOnEscape:true,
            show: true,
            hide: true,
            bgiframe: true
        };
        $("#cancel").dialog(diaOpts);
    }

</script>



{% endblock %}
