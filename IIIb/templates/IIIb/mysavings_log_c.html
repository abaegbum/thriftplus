


{% extends 'IIIb/mysavings_base_c.html' %}

{% block content %}




<div style="text-align:center">Savings deduction Status</div>
   <table style="margin-top:0%;margin-bottom:0%;font-size:0.8em" width="100%" class="table  table-bordered" id="dataTables-example">


    <tr style="text-align:center;">
      <td  >
          <a href="/IIIb/threeb/savings/wallet_packages/" style="color:red">Wallet</a>
      </td>
      <td>
          <a href="/IIIb/threeb/savings/save_packages/" style="color:red">Savings Scheme</a>
      </td>
      <td style="background:blue"><a href="/IIIb/threeb/savings/deposit/view_transactions/" style="color:white">Savings Log</a></td>
    </tr>
</table>


   <table style="margin-top:0%;margin-bottom:0%;font-size:0.8em" width="100%" class="table  table-bordered" id="dataTables-example">


            <tr >
             <td style="font-weight:bold">Year</td>
                <td> 
                          <select name="businessyear" id="id_businessyear" required >
                              {% for pincode in year %}
                                  <option value="{{pincode.year}}">{{pincode.year}}</option>
                              {% endfor %}
                         </select>
                </td>
            </tr>
    
    <tr> 
      <td style="font-weight:bold">E-mail</td>
      <td>{{msg.staff.email}}</td>
    </tr>
    <tr> 
      <td style="font-weight:bold">Name</td>
    <td>{{msg.staff.surname|title}} {{msg.staff.firstname|title}}   {{msg.staff.othername|title}} </td>
  </tr>

   </table>



   <table style="margin-top:0.2%;margin-bottom:0.3%;font-size:0.8em" width="100%" class="table  table-bordered" id="dataTables-example">


 <tr>
    <td style='font-weight:bold'> Transaction Status</td>
   <td>
   <select name="account_type" id="id_account_type">
   <option value="-----">-----</option>
   <option value="Executed">Deducted</option>
   <option value="Awaiting Execution">Awaiting Deduction</option>
   </select>
   </td>
 </tr>
 
       </table>



 <table width="100%" class="table  table-bordered" id="dataTables-example">

           <tr>
                <div class="savebox"></div>
           </tr>
</table>
       


   <script type="text/javascript" >
        $(document).ready(function() {            
            $("#id_account_type").change(function () {
                autopostloan();
            });
            $("#id_account_type").focus();

            autopostloan();
        });
    </script>


  <script type="text/javascript" language="javascript">
        function autopostloan(){
            var state = $("#id_businessyear").val()+ ':'+$("#id_account_type").val();
            // alert(state)
            var url = "/IIIb/threeb/staff/deposit/log/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    $(".savebox").show();
                    $(".savebox").html(html);

                }
            });
            return false;
        }
    </script>


   <script type="text/javascript" >
        $(document).ready(function() {

            $("#id_amount").focus();
  
        });
    </script>


   <script type="text/javascript" >
        $(document).ready(function() {

            $("#id_month").focus();
  
        });
    </script>

{% endblock %}
