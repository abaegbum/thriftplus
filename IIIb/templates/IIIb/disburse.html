  <script type="text/javascript" language="javascript">
        function sources(){
            var state = $("#id_businessyear").val()+ ":" + $("#id_source").val();
            // alert(state)
            var url = "/IIIb/threeb/setsource/ajax/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    $(".boxscenaros2").hide();
                    $(".boxscenaros").show();
                    $(".boxscenaros").html(html);
                }
            });
            return false;
        }
    </script>



  <script type="text/javascript" language="javascript">
        function autopostL(){

            $.ajax({

<script type="text/javascript">
function payoutloans(){        
    // Collect checked items
    var selected = [];
    $("input[name='selected_items']:checked").each(function(){
        selected.push($(this).val());
    });

    // Build state info
    var state = $("#id_businessyear").val()+ ":" +$("#id_status").val()+ ":" + $("#id_source").val();
    // alert(state)
    
    // Prepare data
    var data = {
        userid: state,
        items: selected.join(",")   // send as comma-separated string
    };

    // Ajax call
    $.ajax({
        type: "POST",
        url : "/IIIb/threeb/requests/disburse/pop/",
        data: data,
        success: function(html) {
            $("#cancel").html(html);
            getcancel();
        }
    });
    return false;
}
</script>


<script type="text/javascript">
function payoutsavings(){        
    // Collect checked items
    var selected = [];
    $("input[name='selected_items']:checked").each(function(){
        selected.push($(this).val());
    });

    // Build state info
    var state = $("#id_businessyear").val() + ":" + $("#id_status").val() + ":" + $("#id_source").val()+ ":" + $("#id_savings").val();
    // alert(state)

    // Prepare data
    var data = {
        userid: state,
        items: selected.join(",")   // send as comma-separated string
    };

    // Ajax call
    $.ajax({
        type: "POST",
        url: "/IIIb/threeb/savescheme/pop/",
        data: data,
        success: function(html) {
            $("#cancel").html(html);
            getcancel();
        }
    });
    return false;
}
</script>





<script type="text/javascript" language="javascript">
    function getcancel(){
        var diaOpts = {
            autoOpen:true,
            // appendTo:"body1",
            // modal:true,
            // position: ["center", "middle"],
            height:'auto',
            width:'auto',
            title:'Touch this box to close' ,
            closeOnEscape:true,
            show: true,
            hide: true,
            bgiframe: true
        };
        $("#cancel").dialog(diaOpts);
    }

</script>
