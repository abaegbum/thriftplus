       </table>

<div>Click <a href="#" onclick="edit()">here</a>  to edit the monthly dedcuction into your {{package}} account </div>


  <script type="text/javascript" language="javascript">
        function edit(){
            var state = $("#id_savepack").val();
            // alert(state)
            var url = "/IIIb/threeb/savescheme/edit/pop/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    $("#edit").html(html);
                    getcancel();
                }
            });
            return false;
        }

    </script>



<script type="text/javascript" language="javascript">
    function getcancel(){
        var diaOpts = {
            autoOpen:true,
            // appendTo:"body1",
            // modal:true,
            // position: ["center", "middle"],
            height:'auto',
            width:'auto',
            title:' Touch this box to close' ,
            closeOnEscape:true,
            show: true,
            hide: true,
            bgiframe: true
        };
        $("#edit").dialog(diaOpts);
    }

</script>
