   <script type="text/javascript" >
        $(document).ready(function() {            
            $("#id_month").change(function () {
                autopost20p1();
            });

            $("#id_month").focus();
            autopost20p1();
        });
    </script>


  <script type="text/javascript" language="javascript">
        function autopost20p1(){
            var state = '{{user}}' + ':'+ $("#id_month").val();
            // alert(state)
            var url = "/IIIb/threeb/staff/mydeductions/ajax/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    $(".boxddt").show();
                    $(".boxddt").html(html);
                }
            });
            return false;
        }
    </script>


<script type="text/javascript" language="javascript">
    function chktr(vid){        
        var state = $("#id_month").val() +  ":" + vid;
        // alert(state)
        var url = "/IIIb/threeb/loans/trail/deductions/";
        var i = 0;
        var data='userid='+state;
        $.ajax({
            type:"POST",
            url:url,
            data:data,
            success:function(html) {
                $("#cancel").html(html);
                getcancel();
            }
        });
        return false;
    }

</script>

<script type="text/javascript" language="javascript">
    function getcancel(){
        var diaOpts = {
            autoOpen:true,
            // appendTo:"body1",
            // modal:true,
            // position: ["center", "middle"],
            height:'auto',
            width:'auto',
            title:' Touch this box to close' ,
            closeOnEscape:true,
            show: true,
            hide: true,
            bgiframe: true
        };
        $("#cancel").dialog(diaOpts);
    }

</script>
