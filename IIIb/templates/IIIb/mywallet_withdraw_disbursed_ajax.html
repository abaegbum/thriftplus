

{% load humanize %}




<div style="text-align:center;font-weight:bold;margin-top:0%;margin-bottom:0%;font-size:0.8em">{{status}}  for {{ month}} {{year}}</div>
   <table style="margin-top:0%;margin-bottom:0%;font-size:0.8em;text-align:center" width="100%" class="table  table-bordered" id="dataTables-example">   	
          
           <tr style='font-weight:bold'>
               <td >S/N</td>               
               <td >Month</td>
               <td>Amount ({{company.currency_code}})</td>
               <td>Status</td>
            </tr>
             {% for k in msg %}

          <tr >
            <td >{{forloop.counter}}.</td>
            <td > {{k.month}}</td>
            
            <td >{{k.amount|intcomma}}</td>
            <td>Disburse</td>
          </tr>

          {% endfor %}

         <tr style='text-align:center;font-weight:bold'>
            <td style="border:0px solid black"></td>
           <td>Total {{status}} </td> 
           <td>{{company.currency_code}} {{total|intcomma}}</td> 
        
           
         </tr>

</table>
