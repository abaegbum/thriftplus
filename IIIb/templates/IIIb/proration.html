</form>


<div id="cancel"></div>
<div id="pay"></div>

   <script type="text/javascript" >
        $(document).ready(function() {            
            $("#id_status").change(function () {
                autopost20p1();
            });

            $("#id_month").change(function () {
                autopost20p1();
            });

            $("#id_month").focus();
            autopost20p1();
        });
    </script>


  <script type="text/javascript" language="javascript">
        function autopost20p1(){
            var state = $("#id_businessyear").val() + ":" + $("#id_month").val()+ ":" + $("#id_status").val();
            // alert(state)
            var url = "/IIIb/threeb/loans/scenarios/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    $(".boxscenaros").show();
                    $(".boxscenaros").html(html);
                }
            });
            return false;
        }
    </script>



<script type="text/javascript" language="javascript">
    function prooneoff(){
        var state= $("#id_month").val()+ ":" + $("#id_scenarios").val();
        // alert(state);
        var url = "/IIIb/threeb/savings/prorate/wallet/";
        var i = 0;
        var data='userid='+state;
        $.ajax({
            type:"POST",
            url:url,
            data:data,
            success:function(html) {
                $("#pay").html(html);
                getdial();
            }
        });
        return false;
    }

</script>

<script type="text/javascript" language="javascript">
    function getdial(){
        var diaOpts = {
            autoOpen:true,
            // appendTo:"body1",
            // modal:true,
            // position: ["center", "middle"],
            height:'auto',
            width:'auto',
            title:' If no, touch this box to close' ,
            closeOnEscape:true,
            show: true,
            hide: true,
            bgiframe: true
        };
        $("#pay").dialog(diaOpts);
    }

</script>



<script type="text/javascript" language="javascript">
    function prorate(){        
        var state = $("#id_businessyear").val() +  ":" + $("#id_month").val();
        // alert(state)
        var url = "/IIIb/threeb/proration/all/";
        var i = 0;
        var data='userid='+state;
        $.ajax({
            type:"POST",
            url:url,
            data:data,
            success:function(html) {
                $("#cancel").html(html);
                getcancel();
            }
        });
        return false;
    }

</script>

<script type="text/javascript" language="javascript">
    function details(vid){

        // alert(state)

        $.ajax({

</script>
