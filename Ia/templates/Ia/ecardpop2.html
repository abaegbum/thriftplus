

<table style="margin-top:0%;margin-bottom:0.1%;font-size:0.6em" width="100%" class="table  table-bordered" id="dataTables-example">
            <tr >
             <td><label for="id_month">Month</label></td>
                <td> 
                          <select name="month" id="id_month" required>
                              {% for pincode in data %}
                                  <option value="{{pincode}}">{{pincode}}</option>
                              {% endfor %}
                         </select>
                </td>
            </tr>

            <tr >
             <td><label for="id_cycle">Cycle</label></td>
                <td> 
                          <select name="cycle" id="id_cycle" required >
                             <option value="">-----</option>


                              {% for pincode in year %}
                                  <option value="{{pincode.year}}">{{pincode.year}}</option>
                              {% endfor %}

                              
                         </select>
                </td>
            </tr>


</table>


<table style="margin-top:0%;margin-bottom:0.1%" width="100%" class="table  table-bordered" id="dataTables-example">

           <tr >
                <div class="boxstatement"></div>
           </tr>
</table>


  <script type="text/javascript" >
        $(document).ready(function() {            
            $("#id_month").change(function () {
                fillcycle();
            });


            $("#id_cycle").change(function () {
                autopostacc123e();
            });
            fillcycle();  
        });
    </script>







    <script type="text/javascript" language="javascript">
        function fillcycle(){

            var state = $("#id_business_year").val()  + ":" + $("#id_card").val() + ":" +"{{wallet}}"  + ":" + $("#id_month").val();

            // alert(state)

            var url = "/fts/customer/ecard/statement/";
            var i = 0;
            var data='userid='+state;
            $("#id_cycle").val('');
            $("#id_cycle").html('');
            if (state != undefined){
                $.ajax({
                    type: "POST",
                    url: url,
                    data:data,
                    success: function(data){
                        var options = '';
                        for (i=0; i<data.length; i++){
                            options += '<option value="' + data[i] +'">' + data[i] + '</option>'
                        }
                        $("#id_cycle").append(options);
                        autopostacc123e();
                    }
                })
            }
        }

    </script>


    <script type="text/javascript" language="javascript">
        function autopostacc123e(){
            var state = $("#id_business_year").val() + ":" + "{{wallet}}" + ":" + $("#id_month").val()+ ":" + "{{user}}" + ":" + $("#id_card").val()+ ":" + $("#id_cycle").val();
            // alert(state)
            var url = "/fts/thrift/addthrift/account_statement_history/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    $(".boxstatement").show();
                    $(".boxstatement").html(html);

                }
            });
            return false;
        }
    </script>

    <script language="javascript" type="text/javascript">
        function disable(f)
        {
            var button = f.elements['submit'];
            button.value = 'Processing';
            button.disabled = 'true';
            return true;
        }
    </script>
