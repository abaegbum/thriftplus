


       <form action="/fts/thrift/requests/popcashin/" method="POST">

           <input type="hidden" name="wallet" id="wallet"  readonly="readonly" value="{{ wallet }}" class ="loginTxtbox">

           <input type="hidden" name="thrift" id="thrift"  readonly="readonly" value="{{ thrift }}" class ="loginTxtbox">

        <input type="hidden" name="month" id="month"  readonly="readonly" value="{{ month }}" class ="loginTxtbox">

         <input type="hidden" name="account_type" id="account_type"  readonly="readonly" value="{{ account_type }}" class ="loginTxtbox">
         
<input type="hidden" name="code" id="code"  readonly="readonly" value="{{ code }}">

   <table style="margin-top:-1.7%;margin-bottom:01%;font-size:0.6em" width="100%" class="table  table-bordered" id="dataTables-example">
          <tr> 

        <td >{{ form.amount.label_tag}}:   </td>


    <td> 

        <div class="form-group">
                 <input type="number" name="amount" class="form-control" id="amount" required placeholder="Enter amount here" autofocus>
            </div>
      </td>
  </tr>
</table>

<table style="margin-top:02%;margin-bottom:01%" width="100%" class="table  table-bordered" id="dataTables-example">

       <input class="btn btn-lg btn-success btn-block" style= "font-size:0.6em" name="submit" type= "submit" value="Deposit Funds">

</table>

</form>
