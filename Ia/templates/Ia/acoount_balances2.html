<table>

                <div class="boxbal"></div>

  <script type="text/javascript" >
        $(document).ready(function() {            

            $("#id_month").change(function () {
                fillcycle();
            });
            $("#id_cycle").change(function () {
                autopostacc123e();
            });

            fillcycle()
        });
    </script>








    <script type="text/javascript" language="javascript">
        function fillcycle(){

            var state = $("#id_business_year").val()  + ":" + $("#id_card").val() + ":" +"{{wallet}}" + ":" + "{{user}}" + ":" + $("#id_month").val();

            // alert(state)

            var url = "/fts/customer/balances/balcycle/";

            var i = 0;
            var data='userid='+state;
            $("#id_cycle").val('');
            $("#id_cycle").html('');
            if (state != undefined){
                $.ajax({
                    type: "POST",
                    url: url,
                    data:data,
                    success: function(data){
                        var options = '';
                        for (i=0; i<data.length; i++){
                            options += '<option value="' + data[i] +'">' + data[i] + '</option>'
                        }
                        $("#id_cycle").append(options);
                        autopostacc123e();
                    }
                })
            }
        }

    </script>


    <script type="text/javascript" language="javascript">
        function autopostacc123e(){
            var state = $("#id_business_year").val() + ":" + "{{wallet}}" + ":" + $("#id_month").val()+ ":" + "{{user}}" + ":" + $("#id_card").val()+ ":" + $("#id_cycle").val();
            // alert(state)
            var url = "/fts/customer/account_historypop/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    $(".boxbal").show();
                    $(".boxbal").html(html);

                }
            });
            return false;
        }
    </script>

    <script language="javascript" type="text/javascript">
        function disable(f)
        {
            var button = f.elements['submit'];
            button.value = 'Processing';
            button.disabled = 'true';
            return true;
        }
    </script>
