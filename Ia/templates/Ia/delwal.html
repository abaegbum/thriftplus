
{% load humanize %}



<form action ='/fts/customer/wlletdelete/yes/{{msg.wallet}}/' method = 'POST'  onsubmit="disable(this)">
     {% csrf_token %}


        <div style='font-size:0.7em'>Do you want to delete this wallet?</div>
        <p style='font-size:0.7em'>
          Name : {{msg.name}}   ({{msg.wallet}})
        </p>
      </tr>
        <!-- <div style='font-size:0.7em'>{{msg.wallet}}</div> -->


     <table style="margin-top:0%;margin-bottom:0%" width="100%" class="table  table-bordered" id="dataTables-example">

   <tr>
      <td >
      <input style="font-size:0.7em" class="btn btn-lg btn-success btn-block" name="submit" type= "submit"value="Yes">
    </td>
    <td >
        <a class="btn btn-lg btn-success btn-block"  style="font-size:0.8em;color:white" href=" /fts/mycustomers/dashboard/{{msg.wallet}}/">No</a>
    </td>

  </tr>
</table>

</form>

    <script language="javascript" type="text/javascript">
        function disable(f)
        {
            var button = f.elements['submit'];
            button.value = 'Processing';
            button.disabled = 'true';
            return true;
        }
    </script>
