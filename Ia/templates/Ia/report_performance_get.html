


{% extends 'Ia/reportsbase.html' %}
{% block content %}

{% load humanize %}



<div style="text-align:center">Savings Report Menu</div>

   <table style="margin-top:0%;margin-bottom:0%;font-size:0.9em" width="100%" class="table  table-bordered" id="dataTables-example">

    <tr style="text-align:center;">
       <td  style="background:blue" >
        <a href="/fts/thrift/reports/sales/cashier/" style="color:white">End Of Day</a></td>
         <td >
            <a href="/fts/thrift/reports/sales/merchant/" style="color:red">Vault</a>
        </td>

    <td >
        <a href="/fts/thrift/reports/sales/admn/" style="color:red">Profit</a></td>

    </tr>
</table>

{{msg}}


<form action ="/fts/thrift/reports/sales/cashier/" method='post' onsubmit="disable(this)">
    {% csrf_token %}

<table style="font-size:0.7em;margin-top:0%;margin-bottom:0%" width="100%" class="table  table-bordered" id="dataTables-example">

            <tr >
             <td>
                <label>Business Year</label>
             </td>
                <td> 
                          <select name="myyear" id="id_myyear" required >

                              {% for pincode in year %}
                                  <option value="{{pincode.year}}">{{pincode.year}}</option>
                              {% endfor %}
                         </select>
                </td>
            </tr>
  

            <tr >
                <td><label for="id_products">Product</label></td>
                <td> 
                          <select name="myproducts" id="id_myproducts" required >
                            <option value="">-----</option>                          
                              {% for pincode in prod %}
                                  <option value="{{pincode}}">{{pincode}}</option>
                              {% endfor %}
                         </select>
                </td>
            </tr>

  <tr>

             <td><label for="id_sex">Status</label></td>
                <td> 
                          <select name="status" id="id_status" required >
                            <option value="">-----</option>
                            <option value="Deposit">Deposit</option>
                            <option value="Withdrawal">Withdrawal</option>
                            <option value="All">All Transactions</option>


                         </select>
                </td>
</tr>

</table>




<table style="font-size:0.7em;margin-top:0%;margin-bottom:0%" width="100%" class="table  table-bordered" id="dataTables-example">


<tr>
  <td style= 'font-weight: bold '> From </td>
<td> {{ form.date }}  </td>

  <td style= 'font-weight: bold '> To</td>
<td> {{ form.to_date }}  </td>
</tr>



</table>


<table width="100%" class="table  table-bordered" id="dataTables-example">
                <!-- /.card-body -->
           <div class="card-footer">
            <td >
              <input class="btn btn-lg btn-success btn-block" name="submit" type= "submit" value="View Details">
            </td>
          </div>
</table>

</form>
   




    <script type="text/javascript" language="javascript">
        $(document).ready(function() {
            var pickerOpts = {
                // appendText: "dd/mm/yy",
                showOtherMonths: true,
                changeMonth: true,
                changeYear: true,
                dateFormat:"dd/mm/yy"
            };
            $("#id_date").datepicker(pickerOpts);
            $("#id_to_date").datepicker(pickerOpts);
        });
    </script>


    <script language="javascript" type="text/javascript">
        function disable(f)
        {
            var button = f.elements['submit'];
            button.value = 'Processing';
            button.disabled = 'true';
            return true;
        }
    </script>


    <script>
        $(document).ready(function() {
            $("#id_myproducts").focus();
        });
    </script>

{% endblock %}
