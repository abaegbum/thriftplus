



{% load humanize %}


<div style="text-align:center">Withdraw Menu</div>


<form action="/fts/thrift/cashout/display/" method="POST"  onsubmit="disable(this)">
    {% csrf_token %}

<table style="margin-top:01%;margin-bottom:0.62%;font-size:0.7em" width="100%" class="table  table-bordered" id="dataTables-example">
            <tr >
             <td>Business Year </td>
                <td> 
                          <select name="businee_year" id="id_business_year" required >

                              {% for pincode in year %}
                                  <option value="{{pincode.year}}">{{pincode.year}}</option>
                              {% endfor %}
                         </select>
                </td>
            </tr>

            <tr >
              <td>Customer </td>
                <td> {{ customer.surname }} {{ customer.firstname }} {{ customer.othername }}</td>


            </tr>


            <tr >
              <td >Wallet Address</td>
                <td> {{ customer.wallet }}</td>

            </tr>


            <tr>

</table>



           <tr >
                <div class="withbox"></div>
           </tr>




 
<input type="hidden" name="wallet" id="wallet"  readonly="readonly" value="{{ wallet }}" class ="loginTxtbox">




  <script type="text/javascript" >
        $(document).ready(function() {

        $("#id_business_year").change(function () {
            autocard();
        });

            autocard();
        });
    </script>


    <script type="text/javascript" language="javascript">
        function autocard(){
            var state = $("#id_business_year").val()+ ":" + "{{wallet}}";
            // alert(state)
            var url = "/fts/customer/findcard/withdraw/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    $(".withbox").show();
                    $(".withbox").html(html);

                }
            });
            return false;
        }
    </script>
