<div id="subpack"></div>
 
<script type="text/javascript" language="javascript">
    function changesub(vid){
        
        var state = vid ;
        // alert(state)
        var url = "/sysadmin/sysadmin/sysadmin/extend/change/";
        var i = 0;
        var data='userid='+state;
        $.ajax({
            type:"POST",
            url:url,
            data:data,
            success:function(html) {
                $("#subpack").html(html);
                getchan();
            }
        });
        return false;
    }

</script>

<script type="text/javascript" language="javascript">
    function getchan(){
        var diachange = {
            autoOpen:true,
            // appendTo:"body1",
            modal:true,
            // position: ["center", "middle"],
            height:'auto',
            width:'auto',
            title:'Touch this box to close --->' ,
            closeOnEscape:true,
            show: true,
            // hide: true,
            bgiframe: true
        };
        $("#subpack").dialog(diachange);
    }

</script>
