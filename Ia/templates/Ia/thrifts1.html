<input type="hidden" name="wallet" id="wallet"  readonly="readonly" value="{{ wallet }}" class ="loginTxtbox">




    <script>
        $(document).ready(function() {
            $("#id_cycle").focus();
        });
    </script>

  <script type="text/javascript" >
        $(document).ready(function() {
            $("#id_cycle").change(function () {
                autopostacc();
            });

            $("#id_month").change(function () {
                autopostacc();
            });

            $("#id_card").change(function () {
                autopostacc();
            });

            autopostacc();
        });
    </script>


    <script type="text/javascript" language="javascript">
        function autopostacc(){
            var state = $("#id_cycle").val() + ":" + "{{wallet}}" + ":" + $("#id_month").val()+ ":"+ "{{user}}" + ":" + $("#id_card").val()+ ":" + "{{year}}";
            // alert(state)
            var url = "/fts/customer/findthrift/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    $(".boxaccount_type").show();
                    $(".boxaccount_type").html(html);

                }
            });
            return false;
        }
    </script>
