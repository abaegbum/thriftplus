


{% extends 'Ia/transactionIabase.html' %}
{% block content %}


<div style="text-align:center">Payments Menu</div>


   <table style="margin-top:0%;margin-bottom:0%;font-size:0.9em" width="100%" class="table  table-bordered">

    <tr style="text-align:center;">
        <td style="background:blue;font-size:0.9em">
            <a href="/fts/thrift/unremmitted/" style="color:white">Transactions</a>
        </td>
      
    </tr>
</table>

   

<form action="/fts/thrift/unremmitted/" method="POST" onsubmit="disable(this)">
    {% csrf_token %}


   <table style="margin-top:0%;margin-bottom:0%;font-size:0.9em" width="100%" class="table  table-bordered" >
            <tr >
                <td>Product</td>
                <td> 
                          <select name="myproducts" id="id_myproducts" required >
                            <option value="">Select One</option> 
                    
                              {% for pincode in prod %}
                                  <option value="{{pincode}}">{{pincode}}</option>
                              {% endfor %}
                         </select>
                </td>
            </tr>

           <tr >
               <td >{{ form.status.label_tag}}</td><td> {{ form.status }}</td>
            </tr> 

           <tr >
               <td >{{ form.date.label_tag}}</td><td> {{ form.date }}</td>
            </tr>   
       </table>


       <td >
        <input style="font-size:1sem"  class="btn btn-lg btn-success btn-block" name="submit" type= "submit" value="View Report">
      </td>
</form>




   <script type="text/javascript" >
        $(document).ready(function() {

            $("#id_status").focus();
  
        });
    </script>

    <script type="text/javascript" language="javascript">
        $(document).ready(function() {
            var pickerOpts = {
                // appendText: "yy/mm/dd",
                showOtherMonths: true,
                changeMonth: true,
                changeYear: true,
                dateFormat:"dd/mm/yy"
            };
            $("#id_date").datepicker(pickerOpts);
            //alert("welcome");
            // $("#id_merchant").focus();
            autocomplete();
        });
    </script>




    <script language="javascript" type="text/javascript">
        function disable(f)
        {
            var button = f.elements['submit'];
            button.value = 'Processing';
            button.disabled = 'true';
            return true;
        }
    </script>



{% endblock %}
