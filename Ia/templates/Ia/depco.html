    <script type="text/javascript" language="javascript">
        function autocont(){
            var state=$("#id_cycle").val() + ":" + $("#id_card").val() + ":" + "{{user}}" + ":" + "{{month}}"+ ":" + "{{year}}";
            // alert(state)
            var url = "/fts/thrift/safecount/getcount/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    $(".boxfund").hide();
                    $(".boxcount").show();
                    $(".boxcount").html(html);

                }
            });
            return false;
        }
    </script>
