  <script type="text/javascript" >
        $(document).ready(function() {            
            $("#id_duration").change(function () {
                autopostacc();
            });

            $("#id_pack").change(function () {
                autopostacc();
            });                         
            autopostacc();
        });
    </script>


    <script type="text/javascript" language="javascript">
        function autopostacc(){
            var state = $("#id_pack").val()  + ":" + $("#id_duration").val()+ ":" + "{{user}}";
            // alert(state)
            var url = "/sysadmin/sysadmin/sysadmin/send/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    $(".boxsend").show();
                    $(".boxsend").html(html);

                }
            });
            return false;
        }
    </script>
