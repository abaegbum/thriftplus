  <script type="text/javascript" language="javascript">
       function fillmonth(){
            var state = $("#id_business_year").val()  + ":" + $("#id_card").val() + ":" +"{{wallet}}" +  ":" + $("#id_myproducts").val();

            // alert(state)

            var url = "/fts/customer/withdraw/allmonth/";
            
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    // $(".boxfund").hide();
                    $(".boxcashabc").show();
                    $(".boxcashabc").html(html);
                }
            });
            return false;
        }
    </script>



    <script type="text/javascript" language="javascript">
        function fillcycle(){

            var state = $("#id_business_year").val()  + ":" + $("#id_card").val() + ":" +"{{wallet}}" + ":" + $("#id_month").val();

            // alert(state)

            var url = "/fts/customer/withdraw/withcycle/";         
            
            var i = 0;
            var data='userid='+state;
            $("#id_cycle").val('');
            $("#id_cycle").html('');
            if (state != undefined){
                $.ajax({
                    type: "POST",
                    url: url,
                    data:data,
                    success: function(data){
                        var options = '';
                        for (i=0; i<data.length; i++){
                            options += '<option value="' + data[i] +'">' + data[i] + '</option>'
                        }
                        $("#id_cycle").append(options);
                        autopostacc123e();
                    }
                })
            }
        }

    </script>
