    <script type="text/javascript" language="javascript">
        function bsnyear(){

            var state =  "{{user}}";

            // alert(state)

            var url = "/fts/customer/withdraw/bussyear/";
            var i = 0;
            var data='userid='+state;
            $("#id_business_year").val('');
            $("#id_business_year").html('');
            if (state != undefined){
                $.ajax({
                    type: "POST",
                    url: url,
                    data:data,
                    success: function(data){
                        var options = '';
                        for (i=0; i<data.length; i++){
                            options += '<option value="' + data[i] +'">' + data[i] + '</option>'
                        }
                        $("#id_business_year").append(options);
                        getlistcom();
                        
                    }
                })
            }
        }

    </script>
