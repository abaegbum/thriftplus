  <script type="text/javascript" language="javascript">
       function fillmonth(){
            var state = $("#id_myyear").val() +  ":" + $("#id_card").val() + ":" +"{{wallet}}" + ":" + "{{user}}" +  ":" + $("#id_myproducts").val();

            // alert(state)

            var url = "/fts/customer/manpost/manmonth/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    // $(".boxfund").hide();
                    $(".boxman").show();
                    $(".boxman").html(html);

                    

                }
            });
            return false;
        }
    </script>




<script type="text/javascript" language="javascript">
    function refresh(vid){
        
        var state = vid + ":" + "{{user}}";

        var i = 0;
        var data='userid='+state;

</script>

    <script type="text/javascript" language="javascript">
        function fillcycle(){

            var state = $("#id_myyear").val()   + ":" + $("#id_card").val() + ":" +"{{wallet}}" + ":" + "{{user}}" + ":" + $("#id_month").val();

            // alert(state)

            var url = "/fts/customer/manpost/mancycle/";
            var i = 0;
            var data='userid='+state;
            $("#id_cycle").val('');
            $("#id_cycle").html('');

                $.ajax({
                    type: "POST",

                            options += '<option value="' + data[i] +'">' + data[i] + '</option>'
                        }
                        $("#id_cycle").append(options);
                        autopostacc123e();

    </script>
