



<div style="text-align:center">Customer card Menu</div>


  <form action="/fts/customer/savecard/save/" method="POST" onsubmit="disable(this)">
    {% csrf_token %}
<table style="margin-top:01%;margin-bottom:0.2%;font-size:0.7em" width="100%" class="table  table-bordered" id="dataTables-example">


            <tr >
             <td>Business Year</td>
                <td> 
                          <select name="myyear" id="id_myyear" required >

                              {% for pincode in year %}
                                  <option value="{{pincode.year}}">{{pincode.year}}</option>
                              {% endfor %}
                         </select>
                </td>
            </tr>

            <tr >
              <td >Customer </td>
                <td> {{ customer.surname }} {{ customer.firstname }} {{ customer.othername }}</td>

            </tr>


            <tr >
              <td >Wallet Address</td>
                <td> {{ customer.wallet }}</td>

            </tr>

</table>






           <tr >
                <div class="boxcard"></div>
           </tr>

 
<input type="hidden" name="wallet" id="wallet"  readonly="readonly" value="{{ wallet }}" class ="loginTxtbox">

</form>

  <script type="text/javascript" >
        $(document).ready(function() {            
            $("#id_myyear").change(function () {
                fillcard();
            });

            fillcard()      
        });
    </script>


  <script type="text/javascript" language="javascript">
       function fillcard(){
            var state = $("#id_myyear").val() + ":" +"{{wallet}}";

            // alert(state)

            var url = "/fts/customer/ajax/savecard/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    // $(".boxfund").hide();
                    $(".boxcard").show();
                    $(".boxcard").html(html);

                }
            });
            return false;
        }
    </script>






<script language="javascript" type="text/javascript">
        function disable(f)
        {
            var button = f.elements['submit'];
            button.value = 'Processing';
            button.disabled = 'true';
            return true;
        }
    </script>
