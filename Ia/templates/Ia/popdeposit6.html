       function fillmonth(){
            var state = $("#id_myyear").val() +  ":" + $("#id_card").val() + ":" +"{{wallet}}" + ":" + $("#id_myproducts").val();

            // alert(state)

            var url = "/fts/customer/deposit/valmonth/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    // $(".boxfund").hide();
                    $(".boxmnt").show();
                    $(".boxmnt").html(html);

                }
            });
            return false;
        }
