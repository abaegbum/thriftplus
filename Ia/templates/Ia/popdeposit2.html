



<table style="margin-top:0.1%;margin-bottom:01%;font-size:0.7em" width="100%" class="table  table-bordered" id="dataTables-example">

<table style="margin-top:0%;margin-bottom:0.1%" width="100%" class="table  table-bordered" id="dataTables-example">

           <tr >
                <div class="boxcashabc"></div>
           </tr>
</table>


<table style="margin-top:01%;margin-bottom:0.2%" width="100%" class="table  table-bordered" id="dataTables-example">
           <tr >
                <div class="boxfund"></div>
           </tr>
</table>

  <script type="text/javascript" >
        $(document).ready(function() {            

            $("#id_month").change(function () {
                fillcycle();
            });

            $("#id_cycle").change(function () {
                autopostacc123e();
            });

            fillcycle()
   
        });
    </script>






    <script type="text/javascript" language="javascript">
        function fillcycle(){

            var state = $("#id_myyear").val()  + ":" + $("#id_card").val() + ":" +"{{wallet}}" + ":" + $("#id_month").val();

            // alert(state)

            var url = "/fts/customer/deposit/comcycle/";
            var i = 0;
            var data='userid='+state;
            $("#id_cycle").val('');
            $("#id_cycle").html('');
            if (state != undefined){
                $.ajax({
                    type: "POST",
                    url: url,
                    data:data,
                    success: function(data){
                        var options = '';
                        for (i=0; i<data.length; i++){
                            options += '<option value="' + data[i] +'">' + data[i] + '</option>'
                        }
                        $("#id_cycle").append(options);
                        autopostacc123e();
                    }
                })
            }
        }

    </script>


    <script type="text/javascript" language="javascript">
        function autopostacc123e(){

            var state = $("#id_myyear").val()  + ":" + "{{wallet}}" + ":" + $("#id_month").val()+ ":" +  $("#id_card").val()+ ":" + $("#id_cycle").val();

            // alert(state)

            var url = "/fts/thrift/deposit/account_dep2/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    $(".boxfund").hide();
                    $(".boxcashabc").show();
                    $(".boxcashabc").html(html);

                }
            });
            return false;
        }
    </script>
