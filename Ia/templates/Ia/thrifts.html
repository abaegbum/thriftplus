        $(document).ready(function() {            
            $("#id_card").change(function () {
                autocard();
            });

        });
    </script>


    <script type="text/javascript" language="javascript">
        function autocard(){
            var state = $("#id_myyear").val()+ ":" + "{{wallet}}";
            // alert(state)
            var url = "/fts/customer/findcard/thrift/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    $(".boxcard").show();
                    $(".boxcard").html(html);

                }
            });
            return false;
        }
    </script>
