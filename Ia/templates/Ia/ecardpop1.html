  <script type="text/javascript" >
        $(document).ready(function() {
            $("#id_card").change(function () {
                fillmonth();

            $("#id_myproducts").change(function () {

    <script type="text/javascript" language="javascript">
        function fillmonth(){

            var state = $("#id_business_year").val()  + ":" + $("#id_card").val() + ":" +"{{wallet}}" +  ":" + $("#id_myproducts").val();

            // alert(state)
            var url = "/fts/customer/ecardpop/ecardmonth/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    // $(".boxfund").hide();
                    $(".boxmonth").show();
                    $(".boxmonth").html(html);

                }
            });
            return false;
        }
    </script>
