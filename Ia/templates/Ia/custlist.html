    <script>
        $(document).ready(function() {
            var pickerOpts = {
                //appendText: "mm/dd/yy",
                //defaultDate: "+5",
                showOtherMonths: true,
                changeMonth: true,
                changeYear: true,
                dateFormat:"yy-mm-dd"
            };

            getlistcom();
        });
    </script>



   <script type="text/javascript" >
        $(document).ready(function() {

            $("#id_location").change(function () {
                autpostlist();
            });


        });
    </script>

    <script type="text/javascript" language="javascript">
        function getlistcom(){
            var state =  "{{user}}"; //
            // alert(state);
            var url = "/fts/customer/list/lajax/";
            var i = 0;
            var data='userid='+state;
            $("#id_location").val('');   
            $("#id_location").html('');
            if (state != undefined){
                $.ajax({
                    type: "POST",
                    url: url,
                    data:data,
                    success: function(data){
                        var options = '';
                        for (i=0; i<data.length; i++){
                            options += '<option value="' + data[i] +'">' + data[i] + '</option>'
                        }
                        $("#id_location").append(options);
                        autpostlist();

                    }
                })
            }
        }

    </script>


    <script type="text/javascript" language="javascript">
        function autpostlist(){
            var state = $("#id_location").val() + ":" + "{{user}}";
            // alert(state);

            var url = "/fts/customer/list/adminajaxlist/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    $(".box22").show();
                    $(".box22").html(html);

                }
            });
            return false;
        }
    </script>
