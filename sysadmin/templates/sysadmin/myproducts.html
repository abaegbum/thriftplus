





{% extends 'sysadmin/setup_base.html' %}
{% block content %}


<div style="text-align:center">Back Office Set up</div>

   <table style="margin-top:0%;margin-bottom:01%" width="100%" class="table  table-bordered" id="dataTables-example">

    <tr style="text-align:center;">
         <td ><a href="/sysadmin/sysadmin/setup/password/" style="color:red">Password</a></td>

         <td ><a href="/sysadmin/sysadmin/setup/locations/" style="color:red">Locations</a></td>

       <td style="background:blue"><a href="/sysadmin/sysadmin/setup/products/" style="color:white">Products</a></td>

         <td ><a href="/sysadmin/sysadmin/setup/carding/" style="color:red">Carding</a></td>


    </tr>
</table>



<form action="" method="POST" onsubmit="disable(this)">
    {% csrf_token %}


<table style="margin-top:01%;margin-bottom:2%;text-align:center;font-size:0.8em" width="100%" class="table  table-bordered" id="dataTables-example">

    <tr style='font-weight:bold'>
        <td>S/N</td>
    <td>Product</td>
    <td>Label</td>
</tr>


{% for k in gh %}

{% if k.App_status == 1 %}

<tr>
    <td>{{forloop.counter}}.</td>
        <td>{{k.App_name}}</td>

    <td>
        <input type='text' id='id_k' name='entry_{{k.App_name}}'  value= "{{k.App_label}}" required ></td>
</tr>

{% endif %}
{% endfor %}

</table>

  <table style="margin-top:0%;margin-bottom:02%;font-size:0.8em" width="100%" class="table  table-bordered" >
        <tr>
           <td >
            <input class="btn btn-lg btn-success btn-block" name="submit" type= "submit" value="Save">
          </td>
        </tr>
</table>


</form>


<script language="javascript" type="text/javascript">
        function disable(f)
        {
            var button = f.elements['submit'];
            button.value = 'Processing';
            button.disabled = 'true';
            return true;
        }
    </script>

   <script type="text/javascript" >
        $(document).ready(function() {

            $("#id_k").focus();
  
        });
    </script>


{% endblock %}
