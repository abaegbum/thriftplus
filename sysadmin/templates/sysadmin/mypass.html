





{% extends 'sysadmin/setup_base.html' %}
{% block content %}


<div style="text-align:center">Back Office Set up</div>

   <table style="margin-top:0%;margin-bottom:01%" width="100%" class="table  table-bordered" id="dataTables-example">

    <tr style="text-align:center;">
         <td style="background:blue"><a href="/sysadmin/sysadmin/setup/password/" style="color:white">Password</a></td>

         <td ><a href="/sysadmin/sysadmin/setup/locations/" style="color:red">Locations</a></td>

         <td ><a href="/sysadmin/sysadmin/setup/products/" style="color:red">Products</a></td>

         <td ><a href="/sysadmin/sysadmin/setup/carding/" style="color:red">Carding</a></td>

    </tr>
</table>

{% if history %}

<div style='text-align:center'>your default password was set to  <a href="#" style="" onClick= "psw({{ history.branch.id }})" title="click to change"> {{history.password}} </a> click  to change </div>
      

{% else %}



<form action="" method="POST" onsubmit="disable(this)">
    {% csrf_token %}


<table style="margin-top:01%;margin-bottom:2%;text-align:center;font-size:0.8em" width="100%" class="table  table-bordered" id="dataTables-example">

   <tr>
        <td>Password</td>
    <td>
        <input type='text' name='password' required id='id_password'></td>

    </tr>

</table>

  <table style="margin-top:0%;margin-bottom:02%;font-size:0.8em" width="100%" class="table  table-bordered" id="dataTables-example">
        <tr>
           <td >
            <input class="btn btn-lg btn-success btn-block" name="submit" type= "submit" value="Save">
          </td>
        </tr>
       </table>


</form>


{% endif %}





<div id="ind"></div>

 
<script type="text/javascript" language="javascript">
    function psw(vid){
        
        var state = vid ;
        // alert(state)
        var url = "/sysadmin/sysadmin/setup/password/pop/";
        var i = 0;
        var data='userid='+state;
        $.ajax({
            type:"POST",
            url:url,
            data:data,
            success:function(html) {
                $("#ind").html(html);
                getdind();
            }
        });
        return false;
    }

</script>

<script type="text/javascript" language="javascript">
    function getdind(){
        var diaOpts = {
            autoOpen:true,
            // appendTo:"body1",
            // modal:true,
            // position: ["center", "middle"],
            height:'auto',
            width:'auto',
            title:'Touch the box to close' ,
            closeOnEscape:true,
            show: true,
            hide: true,
            bgiframe: true
        };
        $("#ind").dialog(diaOpts);
    }

</script>














































    <script language="javascript" type="text/javascript">
        function disable(f)
        {
            var button = f.elements['submit'];
            button.value = 'Processing';
            button.disabled = 'true';
            return true;
        }
    </script>

   <script type="text/javascript" >
        $(document).ready(function() {

            $("#id_password").focus();
  
        });
    </script>


{% endblock %}
