

{% extends 'staff/staffbase.html' %}
{% block content %}



<div style="text-align:center">Manage Staff Menu</div>


<div>{{msg}}</div>

<table style="margin-top:0%;margin-bottom:0%" width="100%" class="table table-bordered" id="dataTables-example">
    <tr style="text-align:center;font-size:0.7em">
        <td><a href="/staff/staff/activate/" style="color:red">Activate</a></td>
        <td><a href="/staff/staff/deactivate/" style="color:red">Deactivate</a></td>
        <td><a href="/staff/staff/delete/" style="color:red">Delete</a></td>
        <td style="background:blue"><a href="/staff/staff/reset/" style="color:white">Reset password</a></td>
    </tr>
</table>

<form action="" method="POST">
    {% csrf_token %}
    <table width="100%" class="table table-bordered table-hover" id="dataTables-example">
        <tr>
            <td>{{ form.email.label_tag }}:</td>
            <td>{{ form.email }}</td>
        </tr>
    </table>
    <input class="btn btn-lg btn-success btn-block" name="submit" type="submit" value="Reset">
</form>



<script type="text/javascript">
    $(function() {
        $("#id_email").focus();
    });
</script>






{% endblock %}
