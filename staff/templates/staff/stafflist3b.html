    <div id="psychomotor" >



<script type="text/javascript" language="javascript">
        function roles(vid){
            // alert(vid);
            var state = vid;
            var url = "/staff/staff/selectrole/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    $("#psychomotor").html(html);
                    getdialogpsyco();
                }
            });
            return false;
        }

    </script>

    <script type="text/javascript" language="javascript">
        function getdialogpsyco(){
            var dialogOpts = {
                autoOpen:true,
                height:'auto',
                width:'auto',
                title:'Role set Dialog box' ,
                closeOnEscape:true,
                show: true,
                hide: true,
                bgiframe: true
            };
            $("#psychomotor").dialog(dialogOpts);
        }

    </script>

{% endblock %}
