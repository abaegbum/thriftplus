

{% extends 'staff/membership_base.html' %}
{% block content %}




<div style="text-align:center">Membership Menu </div>
   <table style="margin-top:0%;margin-bottom:01%;font-size:0.9em" width="100%" class="table  table-bordered" id="dataTables-example">

    <tr style="text-align:center;">
        <td  ><a href="/staff/staff/staffdet/" style="color:red"> Registeration</a></td>
        
        <td style="background:blue" ><a href="/staff/staff/registeration/mass/" style="color:white"> Upload Details</a></td>

    </tr>
</table>


{% if messages %}
  <ul>
    {% for message in messages %}
      <li class="{{ message.tags }}">{{ message }}</li>
    {% endfor %}
  </ul>
{% endif %}



  
  <form action="" method="POST"  enctype="multipart/form-data" onsubmit="disable(this)" >
    {%csrf_token %}
    
    <section class="content">
      <div class="container-fluid">
            
            <!-- general form elements -->
            <div class="card card-primary">

                <div class="card-body">

                  <div class="form-group">
                    <label for="customFile">Select File:</label>
                    <div class="custom-file">
                      <input type="file" required name= "excel" class="custom-file-input" id="customFile">
                      <label class="custom-file-label" for="customFile">Choose file</label>
                    </div>
                  </div>

                </div>
              </div>
            </div>
            <div> Excel file should carry workers' emails only</div>
                <!-- /.card-body -->
           <div class="card-footer">
            <td >
              <input class="btn btn-lg btn-success btn-block" name="submit" type= "submit" value="Upload">
            </td>
          </div>
          
      </section>

      </form>

            </div>
            <!-- /.card -->
</div>
</section>


</tr>



    <script language="javascript" type="text/javascript">
        function disable(f)
        {
            var button = f.elements['submit'];
            button.value = 'Processing';
            button.disabled = 'true';
            return true;
        }
    </script>
{% endblock %}
