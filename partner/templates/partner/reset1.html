

{% extends 'partner/basepartner.html' %}
{% block content %}



<div style="text-align:center">Back Office Registration</div>




  <form action="/partner/partner/rrr/" method="POST"  enctype="multipart/form-data" >   
    {% csrf_token %}
    <section class="content">
      <div class="container-fluid">          
            <div class="card card-primary">
                <div class="card-body">
                  
          <table style="margin-top:0%;margin-bottom:04%" width="100%" class="table  table-bordered table-hover" id="dataTables-example">
            {% for k in mybranch %}
            {% for p in k.branch %}
           <tr >
               <td >{{p.company.name}} ({{p.company.id}})</td>
               <td >{{p.Address}}</td>
               <td >{{p.id}}</td>
             </tr>   
            {% endfor %}
            {% endfor %}
       </table>
          <div class="card-footer">
            <td >
              <input class="btn btn-lg btn-success btn-block" name="submit" type= "submit" value="View Details">
            </td>
          </div>
                </div>
              </div>
            </div>
      </section>
      <input type="text" name="email" value="{{email}}">
    
  </form>




   <script type="text/javascript" >
        $(document).ready(function() {

            $("#id_company").focus();

        });
    </script>

{% endblock %}
