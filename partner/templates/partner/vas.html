<tr >

       <form action="" method="POST"  enctype="multipart/form-data" >

         {% csrf_token %}
    
    <section class="content">
      <div class="container-fluid">
            
            <!-- general form elements -->
            <div class="card card-primary">

                <div class="card-body">
                  <div class="form-group">
                    <label for="Business Name">E-Mail</label>
                    <input type="email" autofocus name="email" class="form-control" id="Id_email" placeholder="E-mail" required>
                  </div>

                </div>



                <div class="card-body">
                  <div class="form-group">
                    <label for="Business Name">Amount</label>
                    <input type="number" name="amount" class="form-control" id="Id_amount" placeholder="SMS Amount" required>
                  </div>

                </div>

              </div>
            </div>
                <!-- /.card-body -->
           <div class="card-footer">
            <td >
              <input class="btn btn-lg btn-success btn-block" name="submit" type= "submit" value="Details">
            </td>
          </div>
      </section>
      </form>


</tr>


    <script>
        $(document).ready(function() {
            $("#Id_email").focus();
        });
    </script>

    <script language="javascript" type="text/javascript">
        function disable(f)
        {
            var button = f.elements['submit'];
            button.value = 'Processing';
            button.disabled = 'true';
            return true;
        }
    </script>

{% endblock %}
