



 <form action="/subscription/" method="POST">
    {% csrf_token %}



<table style="margin-top:01%;margin-bottom:2%;text-align:center;font-size:0.6em" width="100%" class="table  table-bordered" id="dataTables-example">


   <tr>
     <td style='font-weight:bold'>Service</td>
     <td>
        <select  name = 'service' id = 'id_service' required>
        <option value="{{g.app}}">{{g.app}}  </option>
       </select>
     </td>
   </tr>



   <tr>
     <td style='font-weight:bold'>Expires</td>
     <td>
        <select  required>
        <option value="{{g.end}}">{{g.end}}  </option>
       </select>
     </td>
   </tr>


   <tr>
     <td style='font-weight:bold'>Status</td>
     <td>
        <select  required>
        <option value="{{g.status}}">{{g.status}}  </option>
       </select>
     </td>
   </tr>


</table>

<div  style="margin-top:01%;margin-bottom:2%;text-align:center;font-size:0.6em"  >You have a pending application for renewal </div>

<table style="margin-top:01%;margin-bottom:0.2%;text-align:center;font-size:0.6em;" width="100%" class="table  table-bordered" id="dataTables-example">
<tr style="font-weight: bold;">
    <td>S/N</td>
    <td>Staff</td>
    <td>Duration</td>
    <td>Status</td>


</tr>

<tr>
    
<td>1.</td>
<td>{{staff}}</td>
{% if sub.duration == '1' %}
<td>{{sub.duration}} month</td>
{% else %}
<td>{{sub.duration}} months</td>
{% endif %}
<td>{{sub.status}}</td>
</tr>
 


</table>
<table style="margin-top:0.1%;margin-bottom:2%;text-align:center;font-size:0.6em;" width="100%" class="table  table-bordered" id="dataTables-example">
<tr> 

<td>Pin </td><td> {{sub.receipt}}</td>
</tr>

<tr> 

<td>Note</td><td>To activate, send pin to agent </td>
</tr>


<table style="margin-top:01%;margin-bottom:0.2%;font-size:0.7em" width="100%" class="table  table-bordered" id="dataTables-example">

<tr >
    <td >
            <input  type='button' class="btn btn-lg btn-success btn-block" value="Continue"
         onclick="closedel();">
        </td>
</tr>

</table>


 </form>




<script>
    function closedel() { 
        $("#depo").dialog("close");
    }
</script>
