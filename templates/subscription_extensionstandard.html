





<table style="margin-top:01%;margin-bottom:2%;text-align:center;font-size:0.8em" width="100%" class="table  table-bordered" id="dataTables-example">

   <tr>
     <td style='font-weight:bold'>Services</td>
     <td>
        <select name="services" id="id_service" required>
        <option value="--">-----</option>
            {% for pincode in service %}
         <option value="{{pincode}}">{{pincode}}</option>
            {% endfor %}

       </select>
     </td>
   </tr>



   <tr>
     <td style='font-weight:bold'>Current Package</td>
     <td>
        <select name="currentpackage" id="id_curpack" required>
        <option value="--">-----</option>
       </select>
     </td>
   </tr>

   <tr>
     <td style='font-weight:bold'>New Package</td>
     <td>
        <select name="package" id="id_pack" required>
        <option value="--">-----</option>
            {% for pincode in data%}
         <option value="{{pincode.id}}">{{pincode.package}}</option>
            {% endfor %}

       </select>
     </td>
   </tr>



   <tr>
     <td style='font-weight:bold'>Duration</td>
     <td>
        <select name="duration" id="id_duration" required>
        <option value="--">-----</option>
         <option value="1">1 Month</option>
          <option value="2">2 Months</option>
          <option value="3">3 Months</option>
          <option value="4">4 Months</option>
          <option value="5">5 Months</option>
          <option value="6">6 Months</option>
          <option value="7">7 Months</option>
          <option value="8">8 Months</option>
          <option value="9">9 Months</option>
          <option value="10">10 Months</option>
          <option value="11">11 Months</option>
          <option value="12">12 Months</option>

       </select>
     </td>
   </tr>


</table>


<table style="margin-top:01%;margin-bottom:0.2%;font-size:0.9em" width="100%" class="table  table-bordered" id="dataTables-example">

           <tr >
                <div class="boxsend"></div>
           </tr>
</table>



  <script type="text/javascript" >
        $(document).ready(function() {            
            $("#id_duration").change(function () {
                autopostacc();
            });

            $("#id_service").change(function () {
                subscription();
            });                         
            subscription();
        });
    </script>





    <script type="text/javascript" language="javascript">
        function subscription(){

            var state = $("#id_service").val()  +  ":" +"{{category}}";

            alert(state)

            var url = "/currentsubscription/";

            var i = 0;
            var data='userid='+state;
            $("#id_curpack").val('');
            $("#id_curpack").html('');
            if (state != undefined){
                $.ajax({
                    type: "POST",
                    url: url,
                    data:data,
                    success: function(data){
                        var options = '';
                        for (i=0; i<data.length; i++){
                            options += '<option value="' + data[i] +'">' + data[i] + '</option>'
                        }
                        $("#id_curpack").append(options);
                        autopostacc();
                    }
                })
            }
        }

    </script>



    <script type="text/javascript" language="javascript">
        function autopostacc(){
            
            var state = $("#id_service").val()  + ":" + $("#id_duration").val()+ ":" + "{{user}}";
            // alert(state)
            var url = "/send/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    $(".boxsend").show();
                    $(".boxsend").html(html);

                }
            });
            return false;
        }
    </script>
