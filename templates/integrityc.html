


{% extends 'howitworks_base.html' %}
{% block content %}

{% load humanize %}



<div style="text-align:center">General Ledger Menu</div>



<span style="color:red">{{msg}}</span>


<form action ="" method='post' onsubmit="disable(this)">
    {% csrf_token %}

<table style="font-size:0.7em;margin-top:0%;margin-bottom:0%" width="100%" class="table  table-bordered" id="dataTables-example">

      <tr >
       <td>
          <label>Business Year</label>
       </td>
          <td> 
            <select name="myyear" id="id_myyear" required >
                {% for pincode in year %}
                    <option value="{{pincode.year}}">{{pincode.year}}</option>
                {% endfor %}
           </select>
          </td>
      </tr>
  

      <tr >
          <td><label>Product</label></td>
          <td> 
                    <select name="myproducts" id="id_myproducts" required >
                      <option value="">-----</option>                          
                        {% for pincode in prod %}
                            <option value="{{pincode.product.product}}">{{pincode.your_product_name}}</option>
                        {% endfor %}
                   </select>
          </td>
      </tr>


            <tr >
                <td><label>Report Type</label></td>
                <td>
                          <select name="reptype" id="id_myreptype" required >
                            <option value="">-----</option>
                            <option value="view">View Ledger</option>
                         </select>
                </td>
            </tr>


</table>



           
                <div class="boxmnt"></div>

 


</form>

  <script type="text/javascript" >
        $(document).ready(function() {            
            $("#id_myyear").change(function () {
                findprod();
            });

            $("#id_myreptype").change(function () {
                findprod();
            });


            $("#id_myproducts").change(function () {
                findprod();
            });

            findprod()      
        });
    </script>


  <script type="text/javascript" language="javascript">
       function findprod(){
            var state = $("#id_myyear").val()+ ":" + $("#id_myproducts").val()+  ":" + $("#id_myreptype").val()+ ":" +"{{user}}";

            // alert(state)

            var url = "/integrity/report/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    // $(".boxfund").hide();
                    $(".boxmnt").show();
                    $(".boxmnt").html(html);

                }
            });
            return false;
        }
    </script>


   
    <script>
        $(document).ready(function() {
            $("#id_myproducts").focus();
        });
    </script>

{% endblock %}
