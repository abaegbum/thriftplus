 <input type= "submit" name="submit"  value="Check Out" class="btn btn-lg btn-success btn-block" Onclick ="sendsub()" >

<div id="send"></div>

<script type="text/javascript" language="javascript">
    function sendsub(){
        var state = "{{user}}" + ":" + $("#id_pack").val()+ ":" + $("#id_duration").val();
        // alert(state);
        var url = "/sendit/";
        var i = 0;
        var data='userid='+state;
        $.ajax({
            type:"POST",
            url:url,
            data:data,
            success:function(html) {
                $("#send").html(html);
                getdial();
            }
        });
        return false;
    }
</script>
<script type="text/javascript" language="javascript">
    function getdial(){
        var diaOpts = {
            autoOpen:true,
            // appendTo:"body",
            // modal:true,
            // position: ["center", "middle"],
            height:'auto',
            width:'auto',
            title:'Touch the box to close' ,
            closeOnEscape:true,
            show: true,
            hide: true,
            bgiframe: true
        };
        $("#send").dialog(diaOpts);
    }

</script>
