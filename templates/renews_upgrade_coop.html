    <script>
        $(document).ready(function() {
            $("#id_duration").focus();
        });
    </script>

  <script type="text/javascript" >
        $(document).ready(function() {            
            $("#id_duration").change(function () {
                pricing();
            });


            $("#id_package").change(function () {
                pricing();
            });
            pricing()      
        });
    </script>


  <script type="text/javascript" language="javascript">
       function pricing(){
            var state = $("#id_service").val() +  ":" + $("#id_duration").val();

            // alert(state)

            var url = "/renews/coop/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    // $(".boxfund").hide();
                    $(".boxmnt").show();
                    $(".boxmnt").html(html);

                }
            });
            return false;
        }
    </script>
