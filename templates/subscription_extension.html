    <script type="text/javascript" language="javascript">
        function autpostlist(){
            var state = $("#id_subtype").val() + ":" + "{{user}}";
            // alert(state);

            var url = "/subty/";
            var i = 0;
            var data='userid='+state;
            $.ajax({
                type:"POST",
                url:url,
                data:data,
                success:function(html) {
                    $(".box22").show();
                    $(".box22").html(html);

                }
            });
            return false;
        }
