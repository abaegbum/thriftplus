


{% extends 'Ia/howitworks_base.html' %}

{% block content %}


{% load humanize %}



<div style="text-align:center">General Ledger Menu</div>
{% if msg %}

   <table style="margin-top:0%;margin-bottom:0.5% ;text-align:center;font-size:0.8em" width="100%" class="table  table-bordered" id="dataTables-example">
    <div>{{ cutt.worker.merchant.surname }}</div>
    <tr style="font-weight:bold">
        <td>S/N</td>
        <td>Date</td>
        <td>Status</td>

    </tr>

{% for b in msg %}
      <tr >
        <td>{{forloop.counter}}.</td>

    </tr>

{% endfor %}
   </table>

{% else %}

<div>Your Data is Clean </div>


{% endif %}


<script type="text/javascript" language="javascript">
window.history.pushState(null, "", window.location.href);
window.onpopstate = function () {
    window.history.pushState(null, "", window.location.href);
};

</script>
